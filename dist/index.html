</style></head><body><main><header><div class="brand"><span>♫</span> פסנתר</div><div class="edition" dir="ltr">THE PIANO ROOM</div></header><section class="intro"><h1>איזה קליד מתאים? 🎵</h1><p>מסתכלים, מקשיבים ומוצאים!</p><div class="modes"><button id="gameMode" aria-pressed="true">🎯 משחק תווים</button><button id="freeMode" aria-pressed="false">🎹 נגינה חופשית</button></div></section><section id="challenge" class="challenge" aria-label="התו שצריך למצוא"><div id="targetCard" class="target-card"></div><div class="game-actions"><button id="listen" aria-label="השמעת שם התו והצליל">🔊 <span>שומעים שוב</span></button><button id="micButton" aria-pressed="false">🎤 הפעלת מיקרופון</button><div id="micStatus" role="status" aria-live="polite"></div><div id="feedback" role="status" aria-live="polite">👆 מצאו את הקליד המתאים</div><button id="next" hidden>התו הבא ◀</button></div></section><section class="instrument" aria-label="פסנתר אינטראקטיבי"><div class="controls"><label class="volume">עוצמה <input id="volume" type="range" min="0" max="100" value="65" aria-label="עוצמת קול"></label><div class="readout"><span class="note" id="note">—</span><span class="hz" id="hz">READY TO PLAY</span></div></div><div class="keyboard" id="keyboard" aria-label="קלידי פסנתר"></div><div class="under"><span>לחיצה · מגע · מקלדת</span><span dir="ltr">C4 — C6 / 25 NOTES</span></div></section><div class="hint"><span>♪</span><p>במשחק, מצאו בפסנתר את התו שמופיע בכרטיס.<br>בנגינה חופשית אפשר לנגן גם אקורדים.</p></div><p id="error" role="alert"></p><footer>המנגינה הבאה מתחילה אצלכם.</footer></main><script>
const names=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const codes=['KeyA','KeyW','KeyS','KeyE','KeyD','KeyF','KeyT','KeyG','KeyY','KeyH','KeyU','KeyJ','KeyK','KeyO','KeyL','KeyP','Semicolon','Quote','BracketRight','Backslash','Digit2','Digit3','Digit4','Digit5','Digit6'];
const letters=['A','W','S','E','D','F','T','G','Y','H','U','J','K','O','L','P',';',"'",']','\\','2','3','4','5','6'];
const keys=new Map(),voices=new Map(),held=new Map();let ctx,master;let whites=0;
for(let midi=60;midi<=84;midi++){const n=names[midi%12]+(Math.floor(midi/12)-1),black=names[midi%12].includes('♯'),b=document.createElement('button');b.className='key '+(black?'black':'white');b.dataset.midi=midi;b.setAttribute('aria-label',n);b.innerHTML='<span class="label">'+n+'<kbd>'+letters[midi-60]+'</kbd></span>';if(black)b.style.left=(whites/15*100-2.15)+'%';else whites++;keyboard.append(b);keys.set(midi,b);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);press(midi,'p'+e.pointerId)});b.addEventListener('pointerup',e=>release('p'+e.pointerId));b.addEventListener('pointercancel',e=>release('p'+e.pointerId));b.addEventListener('lostpointercapture',e=>release('p'+e.pointerId));b.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(!e.repeat)press(midi,'focus')}});b.addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='Enter')release('focus')});b.addEventListener('blur',()=>release('focus'));}
function audio(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=volume.value/100*.35;const compressor=ctx.createDynamicsCompressor();master.connect(compressor);compressor.connect(ctx.destination);}if(ctx.state==='suspended')ctx.resume();}
function press(midi,id){if(held.has(id))return;muteMic(id.startsWith('demo')?1900:1200);if(gameOn&&!id.startsWith('demo'))answer(midi);try{audio();held.set(id,midi);const frequency=440*2**((midi-69)/12);if(!id.startsWith('demo')){keys.get(midi).classList.add('active');note.textContent=names[midi%12]+(Math.floor(midi/12)-1);hz.textContent=frequency.toFixed(2)+' Hz';}const now=ctx.currentTime,g=ctx.createGain();g.connect(master);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(.7,now+.008);g.gain.exponentialRampToValueAtTime(.22,now+.35);g.gain.exponentialRampToValueAtTime(.001,now+5);const oscs=[1,2,3,4].map((h,i)=>{const o=ctx.createOscillator(),a=ctx.createGain();o.type='sine';o.frequency.value=frequency*h;a.gain.value=[1,.27,.1,.035][i];o.connect(a);a.connect(g);o.start(now);o.stop(now+6);return o});voices.set(id,{g,oscs});}catch(e){document.getElementById('error').textContent='לא ניתן להפעיל קול כרגע. נסו לפתוח את האתר בדפדפן אחר.';}}
function release(id){const midi=held.get(id);if(midi===undefined)return;held.delete(id);if(![...held.entries()].some(([key,value])=>value===midi&&!key.startsWith('demo')))keys.get(midi).classList.remove('active');const v=voices.get(id);if(v){const now=ctx.currentTime;v.g.gain.cancelAndHoldAtTime(now);v.g.gain.setTargetAtTime(0,now,.075);v.oscs.forEach(o=>{try{o.stop(now+.4)}catch{}});setTimeout(()=>v.g.disconnect(),500);voices.delete(id)}}
volume.addEventListener('input',()=>{if(master)master.gain.setTargetAtTime(volume.value/100*.35,ctx.currentTime,.02)});document.addEventListener('keydown',e=>{if(e.target.matches('input'))return;const i=codes.indexOf(e.code);if(i>=0&&!e.metaKey&&!e.ctrlKey&&!e.altKey){e.preventDefault();if(!e.repeat)press(60+i,e.code)}});document.addEventListener('keyup',e=>release(e.code));function stopAll(){[...held.keys()].forEach(release)}window.addEventListener('blur',stopAll);document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAll()});

const lesson=[
{midi:60,name:'דו',spoken:'דוֹ',color:'#ff98b5',symbol:'●'},
{midi:62,name:'רה',spoken:'רֶה',color:'#ffb36b',symbol:'▲'},
{midi:64,name:'מי',spoken:'מִי',color:'#edcf51',symbol:'★'},
{midi:65,name:'פה',spoken:'פָה',color:'#70d895',symbol:'■'},
{midi:67,name:'סול',spoken:'סוֹל',color:'#65caee',symbol:'◆'},
{midi:69,name:'לה',spoken:'לָה',color:'#a6a0ff',symbol:'♥'},
{midi:71,name:'סי',spoken:'סִי',color:'#e69fee',symbol:'✿'},
{midi:72,name:'דו ↑',spoken:'דוֹ גָבוֹהַ',color:'#ff98b5',symbol:'● ↑'}];
let gameOn=true,targetIndex=0,answerState='ready',feedbackTimer,listenTimer,advanceTimer,round=0;
const challenge=document.getElementById('challenge'),targetCard=document.getElementById('targetCard'),feedback=document.getElementById('feedback'),next=document.getElementById('next');
function staff(i){const y=85-i*5;return '<svg class="staff" viewBox="0 0 130 105" role="img" aria-label="'+lesson[i].name+' על חמשה במפתח סול">'+[35,45,55,65,75].map(y=>'<line x1="8" y1="'+y+'" x2="125" y2="'+y+'" stroke="#a0a6b8"/>').join('')+'<text x="10" y="75" font-size="55" fill="#d5d8e3">𝄞</text>'+(i===0?'<line x1="72" y1="85" x2="102" y2="85" stroke="currentColor" stroke-width="2"/>':'')+'<ellipse cx="87" cy="'+y+'" rx="8" ry="5.5" fill="currentColor" transform="rotate(-15 87 '+y+')"/><line x1="94" y1="'+y+'" x2="94" y2="'+(y-30)+'" stroke="currentColor" stroke-width="2"/></svg>'}
function showTarget(){clearTimeout(advanceTimer);document.querySelector('.celebration')?.remove();round++;clearTimeout(feedbackTimer);clearTimeout(listenTimer);if(window.speechSynthesis)window.speechSynthesis.cancel();stopAll();answerState='ready';challenge.classList.remove('wrong','correct');keys.forEach(b=>b.classList.remove('wrong','correct'));next.hidden=true;feedback.textContent='👆 מצאו את הקליד המתאים';const n=lesson[targetIndex];targetCard.style.setProperty('--tone',n.color);targetCard.innerHTML='<div><div class="target-symbol">'+n.symbol+'</div><div class="target-name">'+n.name+'</div></div>'+staff(targetIndex)}
function answer(midi){if(answerState!=='ready')return;clearTimeout(feedbackTimer);keys.forEach(b=>b.classList.remove('wrong'));const correct=midi===lesson[targetIndex].midi;challenge.classList.toggle('wrong',!correct);challenge.classList.toggle('correct',correct);keys.get(midi)?.classList.add(correct?'correct':'wrong');if(correct){answerState='correct';feedback.textContent='✓ כל הכבוד! ⭐';next.hidden=true;celebrate();const completedRound=round;advanceTimer=setTimeout(()=>{if(gameOn&&round===completedRound&&answerState==='correct')advanceNote()},2000);}else{feedback.textContent='✕ ננסה שוב';feedbackTimer=setTimeout(()=>{challenge.classList.remove('wrong');keys.forEach(b=>b.classList.remove('wrong'));feedback.textContent='👆 מצאו את הקליד המתאים'},1000)}}
function hear(){muteMic(6000);clearTimeout(listenTimer);const r=round,n=lesson[targetIndex];let played=false;const play=()=>{if(played||r!==round||!gameOn)return;played=true;muteMic(1900);press(n.midi,'demo');setTimeout(()=>release('demo'),700)};audio();if(window.speechSynthesis){window.speechSynthesis.cancel();const voice=window.speechSynthesis.getVoices().find(v=>v.lang.startsWith('he'));if(voice){const utterance=new SpeechSynthesisUtterance(n.spoken);utterance.lang='he-IL';utterance.voice=voice;utterance.rate=.8;utterance.volume=volume.value/100;utterance.onend=play;utterance.onerror=play;window.speechSynthesis.speak(utterance);listenTimer=setTimeout(play,2500);return;}}play()}
function mode(isGame){if(!isGame)stopMic();clearTimeout(advanceTimer);document.querySelector('.celebration')?.remove();stopAll();gameOn=isGame;round++;clearTimeout(feedbackTimer);clearTimeout(listenTimer);if(window.speechSynthesis)window.speechSynthesis.cancel();document.body.classList.remove('learning');challenge.hidden=!isGame;document.getElementById('gameMode').setAttribute('aria-pressed',isGame);document.getElementById('freeMode').setAttribute('aria-pressed',!isGame);keys.forEach((b,midi)=>{const n=lesson.find(n=>n.midi===midi);b.classList.remove('wrong','correct');b.classList.remove('outside');b.style.setProperty('--tone',n?.color||'#ddd');b.innerHTML='<span class="label">'+(isGame?'':names[midi%12]+(Math.floor(midi/12)-1))+'<kbd>'+letters[midi-60]+'</kbd></span>';b.setAttribute('aria-label',isGame?'קליד '+(midi-59):names[midi%12]+(Math.floor(midi/12)-1))});if(isGame)showTarget()}
function celebrate(){document.querySelector('.celebration')?.remove();const burst=document.createElement('div');burst.className='celebration';burst.setAttribute('aria-hidden','true');for(let i=0;i<22;i++){const particle=document.createElement('span');particle.textContent=['⭐','✨','🎵','🎉'][i%4];const angle=i/22*Math.PI*2;particle.style.setProperty('--x',Math.cos(angle)*(130+Math.random()*230)+'px');particle.style.setProperty('--y',Math.sin(angle)*(100+Math.random()*180)+'px');particle.style.setProperty('--r',(Math.random()*160-80)+'deg');burst.append(particle)}document.body.append(burst)}
function advanceNote(){targetIndex=(targetIndex+1+Math.floor(Math.random()*7))%8;showTarget();hear()}

let micStream=null,micSource=null,micAnalyser=null,micFrame=0,micAttempt=0,micUntil=0,micCandidate=null,micStableSince=0,micLastAccepted=null,micSilenceSince=0,micLastFrame=0;
const micButton=document.getElementById('micButton'),micStatus=document.getElementById('micStatus');
function muteMic(ms){micUntil=performance.now()+ms;micCandidate=null;micStableSince=0;micLastAccepted=null;micSilenceSince=0;}
// YIN's normalized difference rejects low-confidence/noisy frames and preserves octaves.
function detectPitch(samples,sampleRate){let energy=0,mean=0;for(const x of samples)mean+=x;mean/=samples.length;for(const x of samples)energy+=(x-mean)**2;if(Math.sqrt(energy/samples.length)<.012)return null;const maxLag=Math.min(Math.floor(sampleRate/75),samples.length>>1),minLag=Math.floor(sampleRate/1400),size=samples.length-maxLag;const diff=new Float32Array(maxLag+1);let cumulative=0;diff[0]=1;for(let lag=1;lag<=maxLag;lag++){let sum=0;for(let i=0;i<size;i++){const delta=samples[i]-samples[i+lag];sum+=delta*delta}cumulative+=sum;diff[lag]=cumulative?sum*lag/cumulative:1;}for(let lag=minLag;lag<maxLag-1;lag++){if(diff[lag]<.12){while(lag+1<maxLag&&diff[lag+1]<diff[lag])lag++;const left=diff[lag-1],mid=diff[lag],right=diff[lag+1];const denom=2*(2*mid-right-left);const precise=lag+(denom?(right-left)/denom:0);return sampleRate/precise}}return null;}
function stopMic(message='המיקרופון כבוי'){micAttempt++;cancelAnimationFrame(micFrame);micStream?.getTracks().forEach(t=>t.stop());micStream=null;micSource?.disconnect();micSource=null;micAnalyser=null;micButton.disabled=false;micButton.setAttribute('aria-pressed','false');micButton.textContent='🎤 הפעלת מיקרופון';micStatus.textContent=message;micCandidate=null;micLastAccepted=null;}
async function startMic(){if(micStream){stopMic();return}if(!navigator.mediaDevices?.getUserMedia){micStatus.textContent='המיקרופון אינו זמין כאן. פתחו בדפדפן דרך HTTPS או בתצוגה המקומית.';return}const attempt=++micAttempt;micButton.disabled=true;micStatus.textContent='נא לאשר גישה למיקרופון בדפדפן';try{audio();await ctx.resume();const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:false,autoGainControl:false},video:false});if(attempt!==micAttempt||!gameOn){stream.getTracks().forEach(t=>t.stop());return}micStream=stream;micSource=ctx.createMediaStreamSource(stream);micAnalyser=ctx.createAnalyser();micAnalyser.fftSize=4096;micSource.connect(micAnalyser);stream.getAudioTracks().forEach(track=>track.addEventListener('ended',()=>{if(micStream===stream)stopMic('המיקרופון התנתק. אפשר להפעיל שוב.')}));micButton.disabled=false;micButton.setAttribute('aria-pressed','true');micButton.textContent='🎤 כיבוי מיקרופון';micStatus.textContent='מקשיבים… נגנו או שירו תו אחד והחזיקו אותו רגע. הצליל מעובד במכשיר בלבד.';muteMic(500);const samples=new Float32Array(micAnalyser.fftSize);function tick(now){if(!micStream)return;micFrame=requestAnimationFrame(tick);if(now-micLastFrame<65)return;micLastFrame=now;if(now<micUntil||!gameOn||answerState!=='ready'||held.size||window.speechSynthesis?.speaking)return;micAnalyser.getFloatTimeDomainData(samples);const hz=detectPitch(samples,ctx.sampleRate);if(!hz){micCandidate=null;if(!micSilenceSince)micSilenceSince=now;if(now-micSilenceSince>200)micLastAccepted=null;return}micSilenceSince=0;const raw=69+12*Math.log2(hz/440),midi=Math.round(raw);if(Math.abs(raw-midi)>.35){micCandidate=null;return}if(micCandidate!==midi){micCandidate=midi;micStableSince=now;return}if(now-micStableSince<300||micLastAccepted===midi)return;micLastAccepted=midi;answer(midi);micStatus.textContent='🎤 שמעתי '+names[midi%12]+(Math.floor(midi/12)-1)+' · נגנו תו חדש או עצרו לרגע ונסו שוב.';}micFrame=requestAnimationFrame(tick);}catch(error){if(attempt!==micAttempt)return;stopMic(error.name==='NotAllowedError'?'הגישה למיקרופון לא אושרה. אפשר לאפשר אותה בהגדרות האתר ולנסות שוב.':error.name==='NotFoundError'?'לא נמצא מיקרופון. חברו מיקרופון ונסו שוב.':'לא ניתן להפעיל את המיקרופון כרגע. בדקו שהוא מחובר ופנוי ונסו שוב.');}}
micButton.onclick=startMic;
window.addEventListener('pagehide',()=>stopMic());document.addEventListener('visibilitychange',()=>{if(document.hidden&&(micStream||micButton.disabled))stopMic('המיקרופון כובה כשעזבתם את המשחק.');});

document.getElementById('gameMode').onclick=()=>mode(true);document.getElementById('freeMode').onclick=()=>mode(false);document.getElementById('listen').onclick=hear;next.onclick=advanceNote;mode(true);
</script></body></html>
