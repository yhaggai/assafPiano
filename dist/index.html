*{box-sizing:border-box}body{margin:0;background:#101219;color:#f4f4f6;font-family:Arial,sans-serif;min-height:100svh}main{max-width:1140px;margin:auto;padding:48px 28px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #30323c;padding-bottom:24px}.brand{font-size:22px;font-weight:bold}.brand span{color:#ac9cff;margin-left:10px}.edition{font-size:13px;color:#9396a7;letter-spacing:3px}.intro{margin:56px 0 32px}h1{font-size:clamp(32px,5vw,52px);margin:0 0 14px;font-weight:500;letter-spacing:-1px}p{font-size:16px;color:#a6a9b8;line-height:1.7;margin:0}.instrument{background:#20232d;border:1px solid #393c48;border-radius:18px;padding:26px 24px 22px;box-shadow:0 30px 65px #0005}.controls{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:26px}.readout{direction:ltr;display:flex;align-items:baseline;gap:14px}.note{font-size:32px;color:#c1b6ff;min-width:65px}.hz{font:14px monospace;color:#a1a6b9}.volume{display:flex;gap:12px;align-items:center;font-size:14px;color:#c9cbd6}input{accent-color:#b3a1ff;width:115px}.keyboard{direction:ltr;position:relative;height:280px;display:flex;gap:3px;touch-action:none;user-select:none}.key{font:inherit;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent}.white{flex:1;min-width:0;border:1px solid #d3d5dd;border-radius:0 0 7px 7px;background:linear-gradient(#fff 88%,#e4e5ed);position:relative;color:#777d8e;box-shadow:0 5px 0 #a2a6b4}.black{position:absolute;top:0;width:4.3%;height:61%;background:linear-gradient(90deg,#11131b,#303440 55%,#161922);border:1px solid #080a10;border-bottom:6px solid #090b11;border-radius:0 0 5px 5px;color:#a7acbc;z-index:2;box-shadow:2px 5px 5px #0005}.key .label{position:absolute;bottom:19px;left:0;right:0;font-size:14px}.key kbd{display:block;font:12px Arial;margin-top:10px;opacity:.7}.white.active{background:linear-gradient(#e8e1ff,#b5a2ff);transform:translateY(3px);box-shadow:0 2px 0 #8172ac}.black.active{background:linear-gradient(#75629d,#ac91eb);border-bottom-color:#615078}.key:focus-visible{outline:3px solid #9474ff;outline-offset:-4px}.under{display:flex;justify-content:space-between;margin-top:24px;color:#9398ab;font-size:13px}.hint{margin-top:28px;display:flex;align-items:center;gap:12px}.hint span{font-size:22px;color:#bbaaff}footer{margin-top:60px;text-align:center;color:#70768a;font-size:13px}#error{color:#ffb4b4;margin-top:16px} @media(max-width:650px){main{padding:26px 14px}.intro{margin:38px 0 26px}.instrument{padding:20px 10px}.keyboard{height:235px;gap:2px}.key .label{font-size:12px}.key kbd{display:none}.black{width:4.8%}.controls{gap:8px}.hz{font-size:12px}.volume{gap:5px}.volume input{width:75px}.edition{font-size:12px;letter-spacing:1px}.under{font-size:12px}.hint{align-items:start}footer{margin-top:40px}}
</style></head><body><main><header><div class="brand"><span>♫</span> פסנתר</div><div class="edition" dir="ltr">THE PIANO ROOM</div></header><section class="intro"><h1>קצת שקט. קצת מוזיקה.</h1><p>בחרו קליד והתחילו לנגן.</p></section><section class="instrument" aria-label="פסנתר אינטראקטיבי"><div class="controls"><label class="volume">עוצמה <input id="volume" type="range" min="0" max="100" value="65" aria-label="עוצמת קול"></label><div class="readout"><span class="note" id="note">—</span><span class="hz" id="hz">READY TO PLAY</span></div></div><div class="keyboard" id="keyboard" aria-label="קלידי פסנתר"></div><div class="under"><span>לחיצה · מגע · מקלדת</span><span dir="ltr">C4 — C6 / 25 NOTES</span></div></section><div class="hint"><span>♪</span><p>אפשר ללחוץ על כמה קלידים יחד ולנגן אקורדים.<br>במחשב, האותיות שעל הקלידים מראות על אילו מקשים ללחוץ.</p></div><p id="error" role="alert"></p><footer>המנגינה הבאה מתחילה אצלכם.</footer></main><script>
const names=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const codes=['KeyA','KeyW','KeyS','KeyE','KeyD','KeyF','KeyT','KeyG','KeyY','KeyH','KeyU','KeyJ','KeyK','KeyO','KeyL','KeyP','Semicolon','Quote','BracketRight','Backslash','Digit2','Digit3','Digit4','Digit5','Digit6'];
const letters=['A','W','S','E','D','F','T','G','Y','H','U','J','K','O','L','P',';',"'",']','\\','2','3','4','5','6'];
const keys=new Map(),voices=new Map(),held=new Map();let ctx,master;let whites=0;
for(let midi=60;midi<=84;midi++){const n=names[midi%12]+(Math.floor(midi/12)-1),black=names[midi%12].includes('♯'),b=document.createElement('button');b.className='key '+(black?'black':'white');b.dataset.midi=midi;b.setAttribute('aria-label',n);b.innerHTML='<span class="label">'+n+'<kbd>'+letters[midi-60]+'</kbd></span>';if(black)b.style.left=(whites/15*100-2.15)+'%';else whites++;keyboard.append(b);keys.set(midi,b);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);press(midi,'p'+e.pointerId)});b.addEventListener('pointerup',e=>release('p'+e.pointerId));b.addEventListener('pointercancel',e=>release('p'+e.pointerId));b.addEventListener('lostpointercapture',e=>release('p'+e.pointerId));b.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(!e.repeat)press(midi,'focus')}});b.addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='Enter')release('focus')});b.addEventListener('blur',()=>release('focus'));}
function audio(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=volume.value/100*.35;const compressor=ctx.createDynamicsCompressor();master.connect(compressor);compressor.connect(ctx.destination);}if(ctx.state==='suspended')ctx.resume();}
function press(midi,id){if(held.has(id))return;try{audio();held.set(id,midi);keys.get(midi).classList.add('active');const frequency=440*2**((midi-69)/12);note.textContent=names[midi%12]+(Math.floor(midi/12)-1);hz.textContent=frequency.toFixed(2)+' Hz';const now=ctx.currentTime,g=ctx.createGain();g.connect(master);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(.7,now+.008);g.gain.exponentialRampToValueAtTime(.22,now+.35);g.gain.exponentialRampToValueAtTime(.001,now+5);const oscs=[1,2,3,4].map((h,i)=>{const o=ctx.createOscillator(),a=ctx.createGain();o.type='sine';o.frequency.value=frequency*h;a.gain.value=[1,.27,.1,.035][i];o.connect(a);a.connect(g);o.start(now);o.stop(now+6);return o});voices.set(id,{g,oscs});}catch(e){document.getElementById('error').textContent='לא ניתן להפעיל קול כרגע. נסו לפתוח את האתר בדפדפן אחר.';}}
function release(id){const midi=held.get(id);if(midi===undefined)return;held.delete(id);if(![...held.values()].includes(midi))keys.get(midi).classList.remove('active');const v=voices.get(id);if(v){const now=ctx.currentTime;v.g.gain.cancelAndHoldAtTime(now);v.g.gain.setTargetAtTime(0,now,.075);v.oscs.forEach(o=>{try{o.stop(now+.4)}catch{}});setTimeout(()=>v.g.disconnect(),500);voices.delete(id)}}
volume.addEventListener('input',()=>{if(master)master.gain.setTargetAtTime(volume.value/100*.35,ctx.currentTime,.02)});document.addEventListener('keydown',e=>{if(e.target.matches('input'))return;const i=codes.indexOf(e.code);if(i>=0&&!e.metaKey&&!e.ctrlKey&&!e.altKey){e.preventDefault();if(!e.repeat)press(60+i,e.code)}});document.addEventListener('keyup',e=>release(e.code));function stopAll(){[...held.keys()].forEach(release)}window.addEventListener('blur',stopAll);document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAll()});
</script></body></html>
